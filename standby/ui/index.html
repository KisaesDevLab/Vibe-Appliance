<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#5b6575; --line:#dfe3ea; --accent:#2457c5; --accent-text:#fff;
          --ok:#1d7a45; --warn:#9a6200; --bad:#b3261e; --ok-bg:#e6f4ec; --warn-bg:#fff4dc; --bad-bg:#fdecea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1b212b; --text:#e8ecf2; --muted:#9aa5b5; --line:#2c3543; --accent:#7aa5ff; --accent-text:#0d1117;
          --ok:#6fd49a; --warn:#f0c060; --bad:#ff8a80; --ok-bg:#16301f; --warn-bg:#3a2d10; --bad-bg:#3a1614; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:46rem; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 16px; } h2 { font-size:1.15rem; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  .big { font-size:1.25rem; font-weight:600; margin:0 0 4px; }
  p { margin:0 0 12px; } .muted { color:var(--muted); } .small { font-size:.9rem; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  .banner { border-radius:10px; padding:16px 20px; margin-bottom:16px; border:1px solid; }
  .ok { background:var(--ok-bg); border-color:var(--ok); } .warn { background:var(--warn-bg); border-color:var(--warn); } .bad { background:var(--bad-bg); border-color:var(--bad); }
  button { font:inherit; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); padding:10px 16px; cursor:pointer; min-height:44px; }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button.danger { border-color:var(--bad); color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  label { display:block; margin:10px 0 4px; font-weight:600; }
  input[type=text], input[type=password], textarea { width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  textarea { min-height:5.5rem; font-family:ui-monospace, monospace; font-size:.9rem; }
  .handson select { font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:inherit; }
  .handson ol { padding-left:20px; } .handson ol > li { margin:10px 0; }
  pre.code { white-space:pre-wrap; margin:8px 0; }
  details.guide { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
  details.guide summary { cursor:pointer; font-weight:600; }
  details.guide h3 { font-size:1rem; margin:16px 0 4px; }
  details.guide ul { margin:4px 0; padding-left:20px; }
  details.guide li { margin:4px 0; }
  details.guide code { font-family:ui-monospace, monospace; font-size:.85rem; overflow-wrap:anywhere; }
  .code { font-family:ui-monospace, monospace; font-size:.9rem; overflow-wrap:anywhere; background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:12px; user-select:all; }
  ol.steps { list-style:none; padding:0; margin:0; } ol.steps li { padding:6px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; }
  .err { color:var(--bad); margin-top:10px; } ul { margin:0 0 12px; padding-left:1.2rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Standby</h1>
  <div id="app"><div class="card"><p class="big">Loading…</p></div></div>
</main>
<script>
// Relative URLs only: this page is served behind the console's proxy prefix.
// Every dynamic value is set with textContent; nothing from the server is parsed as HTML.
const $app = document.getElementById("app");
let S = null, view = { name: "home" }, timer = null, formErr = "";

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
const P = (...t) => h("p", {}, ...t), M = (...t) => h("p", { class: "muted small" }, ...t);
const card = (...k) => h("div", { class: "card" }, ...k);
const btn = (label, fn, cls, disabled) => h("button", { class: cls || "", onclick: fn, disabled: !!disabled }, label);
const when = (iso) => iso ? new Date(iso).toLocaleString([], { weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "never";
const age = (hrs) => hrs == null ? "" : hrs < 1 ? "less than an hour old" : hrs < 48 ? `about ${Math.round(hrs)} hours old` : `about ${Math.round(hrs / 24)} days old`;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong. Try again."), { code: j.code });
  return j;
}
async function load() { try { S = await api("GET", "api/status"); render(); } catch { if (!S) $app.replaceChildren(card(h("p", { class: "big" }, "The standby service is not answering"), M("It may still be starting. This page retries by itself."))); } }
function go(name, extra) { view = { name, ...(extra || {}) }; formErr = ""; render(); }
async function act(fn) { formErr = ""; try { await fn(); await load(); } catch (e) { formErr = e.message; view.lastCode = e.code; render(); } }
const errLine = () => formErr ? h("p", { class: "err", role: "alert" }, formErr) : null;
const field = (id, label, type, hint) => [h("label", { for: id }, label), h("input", { id, type: type || "text", autocomplete: "off", spellcheck: "false" }), hint ? M(hint) : null];
const val = (id) => (document.getElementById(id) || {}).value || "";
const bucketForm = (keyLabel, keyHint) => [
  ...field("endpoint", "Bucket endpoint", "text", "Shown on the bucket's page in Backblaze, for example https://s3.us-west-004.backblazeb2.com"),
  ...field("bucket", "Bucket name"), ...field("keyId", "Key ID"), ...field("key", keyLabel, "password", keyHint),
];
const bucketVals = () => ({ endpoint: val("endpoint"), bucket: val("bucket"), prefix: "standby", keyId: val("keyId"), key: val("key") });

// ---------- screens ----------
function banner() {
  const out = [];
  if (S.conflict) out.push(h("div", { class: "banner bad", role: "alert" }, h("p", { class: "big" }, "Two boxes are acting as the primary"),
    P("The other box was promoted on ", when(S.conflict.writtenAt), ", and this box is still running. Staff may be entering work on two different copies."),
    P("Decide which box is the real one, then stop the other. If the other box is the real one, make this box its standby with the button below. If this box is the real one, open the other box's Standby page and choose “Rejoin as standby” there, or shut it down."),
    h("div", { class: "row" }, btn("Make this box the standby instead…", () => go("rejoin"), "danger"))));
  if (S.health === "failed" || S.health === "stale") out.push(h("div", { class: "banner bad" }, h("p", { class: "big" }, S.health === "failed" ? "Needs attention" : "Out of date"), P(S.summary),
    S.lastSync && !S.lastSync.ok ? M("What went wrong: ", S.lastSync.error || "unknown") : null, S.lastCapture && !S.lastCapture.ok ? M("What went wrong: ", S.lastCapture.error || "unknown") : null));
  else if (S.health === "degraded") out.push(h("div", { class: "banner warn" }, h("p", { class: "big" }, "Working, with a caution"), P(S.summary), h("ul", {}, S.versionIssues.map((v) => h("li", {}, v)))));
  else if (S.health === "healthy") out.push(h("div", { class: "banner ok" }, h("p", { class: "big" }, "All good"), P(S.summary)));
  if (S.pairing) out.push(S.alertEmail && view.name !== "home-email"
    ? h("p", { class: "muted small" }, "Problems on this box are emailed to ", S.alertEmail, ". ", h("a", { href: "#", onclick: (e) => { e.preventDefault(); go("home-email"); } }, "Change"))
    : h("div", { class: "banner warn" }, P(S.alertEmail ? "Where should this box send an email when something is wrong?" : "No alert email address is set, so problems are shown only on this page."),
        h("label", { for: "alertEmail" }, "Email address for alerts"), h("input", { id: "alertEmail", type: "text", autocomplete: "email" }), errLine(),
        h("div", { class: "row" }, btn("Save", () => act(async () => { await api("POST", "api/settings/alert-email", { email: val("alertEmail") }); view = { name: "home" }; }), "primary"))));
  return out;
}

function unpaired() {
  if (view.name === "pick-mode") return card(h("h2", {}, "How will the two boxes reach each other?"),
    P("Direct: both boxes are on the same office network, or both are on Tailscale. Nothing else is needed."),
    P("Through a storage bucket: the boxes are in different places and cannot reach each other. You create one Backblaze B2 bucket for this, and two keys."),
    h("div", { class: "row" }, btn("Direct", () => go(view.as + "-direct", { as: view.as }), "primary"), btn("Through a storage bucket", () => go(view.as + "-bucket", { as: view.as })), btn("Back", () => go("home"))));
  if (view.name === "primary-direct") return card(h("h2", {}, "Pairing code for the standby"),
    view.code ? [P("Open the console on the other box, choose Standby, then “This box will be the standby”, and paste this code:"), h("div", { class: "code" }, view.code),
      M("The code works once and stops working at ", when(view.expiresAt), ". This page updates by itself when the other box has paired.")]
      : [P("This box stays the live one. The other box will be overwritten with a copy of this one."), h("div", { class: "row" }, btn("Create the code", () => act(async () => { const r = await api("POST", "api/pair/direct/start"); view.code = r.code; view.expiresAt = r.expiresAt; }), "primary"), btn("Back", () => go("home")))], errLine());
  if (view.name === "standby-direct") return card(h("h2", {}, "Enter the code from the primary"),
    P("On the primary, open Standby and choose “This box is the primary”. Paste the code it shows here."),
    M("If this box has a Cloudflare Tunnel of its own, that tunnel and its DNS records are removed when it becomes the standby: after a promote it uses the primary's. A tunnel it shares with the primary is left alone."),
    h("label", { for: "code" }, "Pairing code"), h("textarea", { id: "code" }),
    view.lastCode === "has-data" ? h("div", { class: "banner bad" }, P("This box already holds data. Continuing replaces everything on it with the primary's data."), h("label", {}, h("input", { type: "checkbox", id: "ow" }), " I understand. Replace this box's data.")) : null,
    errLine(), h("div", { class: "row" }, btn("Pair", () => act(() => api("POST", "api/pair/direct/join", { code: val("code"), confirmOverwrite: !!(document.getElementById("ow") || {}).checked })), "primary"), btn("Back", () => go("home"))));
  if (view.name === "standby-bucket") return card(h("h2", {}, view.code ? "Give this code to the primary" : "This standby's read-only key"),
    view.code ? [P("On the primary, open Standby, choose “This box is the primary”, then “Through a storage bucket”, and paste this code:"), h("div", { class: "code" }, view.code),
      M("This page checks the bucket by itself and finishes when the primary has paired."), h("div", { class: "row" }, btn("Check now", () => act(() => api("POST", "api/pair/bucket/complete"))))]
      : [P("In Backblaze, create a bucket just for Standby (private, no Object Lock). Then create an application key for that bucket with read-only access, and enter it here."),
        M("If this box has a Cloudflare Tunnel of its own, that tunnel and its DNS records are removed when it becomes the standby: after a promote it uses the primary's. A tunnel it shares with the primary is left alone."),
        ...bucketForm("Read-only application key", "This box can read the bucket but never write to it."),
        view.lastCode === "has-data" ? h("div", { class: "banner bad" }, P("This box already holds data. Continuing replaces everything on it with the primary's data."), h("label", {}, h("input", { type: "checkbox", id: "ow" }), " I understand. Replace this box's data.")) : null,
        h("div", { class: "row" }, btn("Continue", () => act(async () => { const r = await api("POST", "api/pair/bucket/standby", { ...bucketVals(), confirmOverwrite: !!(document.getElementById("ow") || {}).checked }); view.code = r.code; }), "primary"), btn("Back", () => go("home")))], errLine());
  if (view.name === "primary-bucket") return card(h("h2", {}, "The bucket, and the code from the standby"),
    P("Use the same bucket you entered on the standby. Create a second application key for it with read and write access, and enter that one here."),
    ...bucketForm("Read and write application key"), h("label", { for: "code" }, "Code shown on the standby"), h("textarea", { id: "code" }), errLine(),
    h("div", { class: "row" }, btn("Pair", () => act(() => api("POST", "api/pair/bucket/primary", { ...bucketVals(), code: val("code") })), "primary"), btn("Back", () => go("home"))));
  const live = S.role === "primary";
  return [
    S.formerLive ? h("div", { class: "banner bad", role: "alert" }, h("p", { class: "big" }, "The box this one replaced is running again"),
      P("This box was promoted and is the live one, but the old box is answering as a primary too. Staff may be entering work on two different copies."),
      P("Open the old box's Standby page and choose “Rejoin as standby”, or shut it down.")) : null,
    S.rejoining ? h("div", { class: "banner warn" }, h("p", { class: "big" }, "Ready to rejoin as a standby"), P("This box's apps are stopped", S.rejoining.archived ? " and its old data is set aside (see below)." : ".", " Pair it now as the standby of the box that is live.")) : null,
    card(h("p", { class: "big" }, live ? "This box is live and has no standby" : "This box is not paired yet"),
      P("A standby is a second box that receives a copy of this firm's data every night. If the main box fails, you can make the standby take over."),
      M("A standby is not a backup: it keeps only the latest copy. Keep Vibe Backup running as well."),
      h("div", { class: "row" }, btn("This box is the primary (the live one)", () => go("pick-mode", { as: "primary" }), live ? "primary" : ""),
        live ? null : btn("This box will be the standby", () => go("pick-mode", { as: "standby" })))),
  ];
}

function typed(phrase, label, onGo, cls, extra) {
  return [h("label", { for: "typed" }, `Type ${phrase} to confirm`), h("input", { id: "typed", type: "text", autocomplete: "off" }), extra || null, errLine(),
    h("div", { class: "row" }, btn(label, () => onGo(val("typed")), cls || "danger"), btn("Back", () => go("home")))];
}

function primary() {
  if (view.name === "switchover") return card(h("h2", {}, "Planned switchover"),
    P("Use this to move the firm to the standby on purpose, for example before maintenance. Nothing is lost."),
    h("ul", {}, h("li", {}, "The apps on this box stop. Staff cannot work until the next step is done."), h("li", {}, "This box sends one final copy to the standby."), h("li", {}, "You then open the standby and choose Promote.")),
    ...typed(S.phrases.switchover, "Stop the apps and send the final copy", (t) => act(() => api("POST", "api/switchover/start", { confirm: t }))));
  if (view.name === "unpair") return unpairScreen();
  if (view.name === "rejoin") return rejoinScreen();
  const r = S.standbyReport, c = S.lastCapture;
  return [
    S.switchover ? h("div", { class: "banner warn" }, h("p", { class: "big" }, "Planned switchover in progress"), P("The apps on this box are stopped and the final copy was sent at ", when(S.switchover.at), "."),
      P("Next: open the console on the standby, choose Standby, wait until it shows it has this copy, then choose Promote."), errLine(), h("div", { class: "row" }, btn("Cancel and bring the apps back here", () => act(() => api("POST", "api/switchover/cancel"))),
        view.lastCode === "cannot-check" ? btn("I checked: the other box is still the standby. Bring the apps back here", () => { if (confirm("Only continue if the other box's Standby page still says it is the standby. If it was promoted, starting the apps here gives you two live copies.")) act(() => api("POST", "api/switchover/cancel", { force: true })); }, "danger") : null,
        view.lastCode === "promoted" ? btn("Rejoin as standby…", () => go("rejoin"), "primary") : null)) : null,
    card(h("p", { class: "big" }, "This box is the primary"), h("dl", {},
      h("dt", {}, "Last copy sent"), h("dd", {}, c ? (c.ok ? [when(c.at), c.unreadable ? ` (${c.unreadable} file${c.unreadable === 1 ? "" : "s"} changed or vanished while being read and ${c.unreadable === 1 ? "is" : "are"} not in this copy; a few is normal on a box in use)` : ""] : "failed at " + when(c.at)) : "not yet"),
      h("dt", {}, "Copies go"), h("dd", {}, S.pairing.mode === "direct" ? "directly to the standby" : "through the storage bucket"),
      h("dt", {}, "Standby"), h("dd", {}, S.standbyVisible ? (r ? `${r.health}, as of ${when(r.at)}` : "has not reported yet") : "its status is shown on the standby's own page"),
      h("dt", {}, "Next copy"), h("dd", {}, `every night at ${S.settings.captureAt} (${S.settings.timezone === "UTC" ? "UTC, not local time: set the time zone under Configuration" : S.settings.timezone + " time"})`)),
      h("div", { class: "row" }, btn(S.busy === "capture" ? "Sending a copy…" : "Send a copy now", () => act(() => api("POST", "api/capture/run")), "", !!S.busy || !!S.switchover),
        S.switchover ? null : btn("Planned switchover…", () => go("switchover")), btn("Unpair…", () => go("unpair")))),
  ];
}

function unpairScreen() {
  return card(h("h2", {}, "Unpair these boxes"), P("The nightly copy stops. Neither box's data is deleted. You can pair them again later."),
    ...typed(S.phrases.unpair, "Unpair", (t) => act(async () => { await api("POST", "api/unpair", { confirm: t }); view = { name: "home" }; })));
}

function standby() {
  if (view.name === "unpair") return unpairScreen();
  if (S.promote && (S.promote.inProgress || S.promote.running || (S.promote.result && view.name === "promote-run"))) return promoteRun();
  if (view.name === "promote-checks") return promoteChecks();
  if (view.name === "promote-loss") return card(h("h2", {}, "What you will lose"),
    h("p", { class: "big" }, "Work entered after ", when(view.checks.dataAt), " is not on this box."),
    view.checks.plannedSwitchover ? P("This is a planned switchover: the primary stopped before sending this copy, so nothing is missing.") : P("Anything staff or clients entered on the old box after that time will not be here. It is still on the old box if that box can be repaired."),
    P("Everyone will need to sign in again. Jobs that were waiting to run on the old box (queued emails and the like) will not run here; nothing is sent twice."),
    h("div", { class: "row" }, btn("I understand, continue", () => go("promote-confirm", { checks: view.checks }), "primary"), btn("Back", () => go("home"))));
  if (view.name === "promote-confirm") return card(h("h2", {}, "Make this box the live one"),
    P("This box will start the firm's apps using its copy from ", when(view.checks.dataAt), ". This takes several minutes. You can leave this page open; if it is interrupted, come back here and it continues."),
    ...typed(S.phrases.promote, "Promote this box", (t) => act(async () => { await api("POST", "api/promote/run", { confirm: t }); view = { name: "promote-run" }; })));
  const run = S.lastSync, tc = S.tunnelCleanup;
  return [
    tc && tc.status === "pending" ? h("p", { class: "muted small" }, "Removing this box's own Cloudflare Tunnel and its DNS records…") : null,
    tc && (tc.status === "failed" || tc.status === "skipped") ? h("div", { class: "banner warn" }, h("p", { class: "big" }, "This box's old Cloudflare Tunnel is still there"),
      P(tc.status === "failed" ? "It could not be removed from your Cloudflare account. Nothing is wrong with the standby; the unused tunnel and its DNS records are simply left over." : "It was not removed, because " + (tc.detail || "it could not be told apart from the primary's") + "."),
      tc.status === "failed" && tc.detail ? M(tc.detail) : null,
      tc.status === "failed"
        ? [M("Tunnel ID ", tc.tunnelId || "unknown", ". You can also delete it by hand in the Cloudflare dashboard: Zero Trust → Networks → Tunnels, and the DNS records that point at it."), errLine(),
          h("div", { class: "row" }, btn("Try again", () => act(() => api("POST", "api/tunnel-cleanup/retry"))))]
        : M("Tunnel ID ", tc.tunnelId || "unknown", ". Before deleting anything, check on the live box (Configuration → Network → Cloudflare Tunnel) that it does NOT use this tunnel. If it does, leave it alone: it is the firm's.")) : null,
    card(h("p", { class: "big" }, "This box is the standby"),
      S.dataAt ? P("It holds the primary's data as of ", h("strong", {}, when(S.dataAt)), " (", age(S.dataAgeHours), ").") : P("It has not received a copy yet."),
      h("dl", {}, h("dt", {}, "Last check"), h("dd", {}, run ? `${run.ok ? "succeeded" : "failed"} ${when(run.at)}` : "not yet"),
        h("dt", {}, "Copies arrive"), h("dd", {}, S.pairing.mode === "direct" ? "directly from the primary" : "through the storage bucket"),
        h("dt", {}, "Apps on this box"), h("dd", {}, "stopped, as they should be")),
      h("div", { class: "row" }, btn(S.busy === "sync" ? "Syncing…" : "Sync now", () => act(() => api("POST", "api/sync/run")), "", !!S.busy), btn("Unpair…", () => go("unpair")))),
    card(h("h2", {}, "If the primary is down"), P("Promote makes this box the live one, using the copy it holds. Only do this when the primary cannot be used."),
      h("div", { class: "row" }, btn("Promote…", () => go("promote-checks"), "primary", !S.dataAt))),
    drillCard(),
  ];
}

// Practice drill: starts the primary's apps from this box's copy, cut off from
// the internet and from staff, checks them, then removes everything.
function drillCard() {
  const d = S.drill || { history: [] }, last = d.history[0];
  const kids = [h("h2", {}, "Practice drill"),
    P("Checks that this box could really take over: it starts the firm's apps from its copy, cut off from the internet and from your staff, checks that each one comes up and shows its sign-in page, then removes everything. Your copy, the primary and your staff are not affected."),
    M(S.settings && S.settings.drillSchedule === "first-sunday" ? "Runs by itself on the first Sunday of each month, after that night's sync." : "Not scheduled; run it here when you want.")];
  if (d.running) {
    kids.push(h("p", { class: "big" }, "Drill running…"), M("Started ", when(d.running.startedAt), ". This usually takes 5 to 15 minutes. If the primary fails meanwhile, Promote still works: it stops the drill first."));
  } else if (last) {
    kids.push(h("div", { class: "banner " + (last.ok ? "ok" : "bad") },
      h("p", { class: "big" }, last.ok ? "Last drill passed" + (last.skipped.length ? `, ${last.skipped.length} app${last.skipped.length === 1 ? "" : "s"} not drilled` : "") : "Last drill did not pass"),
      M(when(last.finishedAt), last.trigger === "schedule" ? " (monthly)" : "", last.dataAt ? ` · copy from ${when(last.dataAt)}` : ""),
      last.apps.length ? h("ul", {}, last.apps.map((a) => h("li", {}, h("strong", {}, a.slug), a.ok ? ` passed${a.secondsToReady != null ? `, ready in ${a.secondsToReady} s` : ""}` : `: ${a.detail}`))) : null,
      last.skipped.length ? h("ul", {}, last.skipped.map((x) => h("li", {}, h("strong", {}, x.slug), `: ${x.reason}`))) : null,
      (last.restoreWarnings || []).length ? h("ul", {}, last.restoreWarnings.map((x) => h("li", {}, "Database: ", x))) : null,
      last.error ? P(last.error) : null, last.fix ? M(last.fix) : null,
      last.isolated === false ? P(h("strong", {}, "The drill could reach the internet, which must never happen. Do not run another drill; contact support with the drill history.")) : null,
      last.copyUnchanged ? null : P("This box's copy no longer matches what was verified. Choose Sync now before relying on it.")));
  }
  if (d.handsOn) kids.push(handsOnOpen(d.handsOn));
  else if (last && last.handsOn && last.handsOn.endedAt) kids.push(M("Hands-on drill ended ", when(last.handsOn.endedAt), ": ", last.handsOn.endReason || "", " Remove the drill's lines from your computer's hosts file and its certificate, if you have not yet."));
  kids.push(errLine(), h("div", { class: "row" },
    btn(d.running ? "Drill running…" : "Run a practice drill", () => act(() => api("POST", "api/drill/run")), "", !!d.running || !!S.busy || !!d.blocked || !S.dataAt),
    d.history.length ? h("a", { href: "api/drills.csv", download: "vibe-standby-drills.csv", style: "align-self:center" }, "Download drill history") : null),
    M("A drill does not test DNS, the Cloudflare tunnel or this box's own web address; those change only at a real promote."),
    d.handsOn ? null : handsOnStart(d),
    drillGuide());
  return card(...kids);
}

// Hands-on drill: the same drill, left running for the admin's own computer.
function handsOnStart(d) {
  const off = !!d.running || !!S.busy || !!d.blocked || !S.dataAt;
  return h("div", { class: "handson" },
    h("h3", {}, "Use the apps yourself"),
    P("A hands-on drill runs the same checks, then leaves the apps running so you can sign in and look: clients, recent entries, reports, attachments. It is open to this computer only, while your staff keep working on the primary. Anything you enter is thrown away when it ends."),
    M("You will add a few lines to this computer's hosts file and trust a temporary certificate; the panel shows how. Open this panel by the box's IP address while the drill is open. No nightly sync runs while it is open."),
    h("div", { class: "row" },
      h("label", { for: "ho-min", style: "align-self:center" }, "Keep it open for"),
      h("select", { id: "ho-min" }, h("option", { value: "60" }, "1 hour"), h("option", { value: "120", selected: true }, "2 hours"), h("option", { value: "240" }, "4 hours")),
      btn("Start hands-on drill", () => act(() => api("POST", "api/drill/hands-on", { minutes: Number(val("ho-min")) })), "", off)));
}

function handsOnOpen(ho) {
  const lines = ho.hosts.map((x) => `${ho.address}  ${x}`).join("\n");
  const step = (title, ...body) => h("li", {}, h("strong", {}, title), ...body);
  return h("div", { class: "banner warn handson" },
    h("p", { class: "big" }, "Hands-on drill open until ", new Date(ho.until).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })),
    M("Open to this computer only (", ho.allow.map((a) => a.replace(/\/(32|128)$/, "")).join(", "), "). Anything entered in it is thrown away."),
    h("ol", {},
      step("Trust the drill's certificate. ", h("a", { href: "api/drill/ca.crt", download: "vibe-practice-drill.crt" }, "Download it"),
        M("Windows: double-click it, Install Certificate, Current User, \"Place all certificates in the following store\", Trusted Root Certification Authorities. Mac: double-click it, then in Keychain Access open \"Vibe practice drill\" and set Trust to Always Trust. Restart the browser.")),
      step("Point this computer at the drill. ", M("Add these lines to the hosts file (Windows: open Notepad as administrator, then C:\\Windows\\System32\\drivers\\etc\\hosts. Mac: sudo nano /etc/hosts):"),
        h("pre", { class: "code" }, lines)),
      step("Open the apps. ", M("Each one first shows a red PRACTICE COPY page; then sign in as usual."),
        h("ul", {}, ho.hosts.map((x) => h("li", {}, h("a", { href: `https://${x}/`, target: "_blank", rel: "noopener" }, x))))),
      step("When you are done: ", M("press End, then delete the lines from the hosts file and remove the \"Vibe practice drill\" certificate (Windows: certmgr.msc, Trusted Root Certification Authorities; Mac: Keychain Access). Until you remove the lines, this computer cannot reach the live apps."))),
    h("div", { class: "row" }, btn("End the hands-on drill", () => act(() => api("POST", "api/drill/hands-on/end")), "", !!S.busy && S.busy !== "drill")));
}

// The drill, explained for the admin: what it does, how to read a result,
// what to do about each kind of failure.
function drillGuide() {
  const sec = (title, ...body) => [h("h3", {}, title), ...body];
  const li = (...items) => h("ul", {}, items.map((x) => h("li", {}, x)));
  const code = (t) => h("code", {}, t);
  return h("details", { class: "guide" }, h("summary", {}, "How the practice drill works"),
    ...sec("What it does",
      li("Starts every app the primary runs, from this box's last verified copy, in a separate, throwaway setup.",
        "Databases go into a throwaway database server; files are a copy-on-write view of the copy. Nothing is ever written to the copy itself.",
        "The drill's network has no way out: no internet, no tunnel, no route to your staff or the primary. Every drill tests this itself.",
        "Each app is started on its own, so one broken app does not stop the others.",
        "When it finishes (usually 5 to 15 minutes) everything it started is removed, and the result is emailed to the alert address.")),
    ...sec("What it checks, per app",
      li("Every container of the app started and stayed up; one-off jobs (database migrations) finished without an error.",
        "The app's health check answers 200.",
        "Its sign-in page answers. A setup page that is gone because the firm already ran setup (404) is fine.",
        "Afterwards: this box's copy still matches exactly what was verified.")),
    ...sec("Reading a failed result",
      li(h("span", {}, h("strong", {}, "stopped (exit 1)"), ": the app crashed while starting. Its last log lines are kept on this box until the next drill: ", code("sudo ls /opt/vibe/standby/drill-logs"), ", then ", code("sudo tail -40 /opt/vibe/standby/drill-logs/<container>.log"), "."),
        h("span", {}, h("strong", {}, "was never started"), ": something it depends on (usually the same app's server) did not come up. Fix that one first."),
        h("span", {}, h("strong", {}, "health check / sign-in page answered 000"), ": nothing answered, normally because the app is not running. See the line before it."),
        h("span", {}, h("strong", {}, "a log that mentions registry.npmjs.org, getaddrinfo or EAI_AGAIN"), ": the app tries to download something from the internet when it starts. It would fail the same way on any box without internet. Fix it in the app (ask its maintainer), not here."),
        h("span", {}, h("strong", {}, "Database: … restored with warnings"), ": the database came back, but the restore tool skipped something. Usually harmless; the nightly sync checks tables and row counts."),
        h("span", {}, h("strong", {}, "the copy did not match"), ": something other than the drill changed the copy, or a file was left in it. The next nightly sync replaces the copy; Sync now does so too when the primary has sent a newer one."),
        h("span", {}, h("strong", {}, "NOT isolated"), ": the drill could reach the outside. This must never happen: run no further drills and contact support with the drill history."))),
    ...sec("Before you rely on a pass",
      li("A pass means the apps start on the copy and answer. It does not mean someone checked the data by hand.",
        "It does not test DNS, the Cloudflare tunnel or this box's web address; only a real promote does. A planned switchover after hours tests everything.",
        "A drill needs memory for every app plus a second database server. On a small box it may refuse with \"not enough free memory\".",
        "A promote never waits for a drill: it stops it within seconds and takes over.")),
    ...sec("Hands-on drill",
      li("Runs the same checks, then leaves the apps running for 1, 2 or 4 hours so you can sign in and look at the data yourself.",
        "Only the computer that pressed Start can reach it; any other computer is refused. Your staff keep using the primary.",
        "This box's own web server answers the primary's app addresses for your computer only, in memory. A restart of the web server, End, the time limit or a promote takes it away again.",
        "Its certificate comes from a throwaway authority made for this drill and deleted when it ends; remove it from your computer afterwards too.",
        "Anything entered is thrown away. Nothing in it can send email, file returns or reach the internet, so things that need the internet (bank feeds, e-filing, single sign-on through an outside provider) will not work in it.",
        "Needs the primary to use its own web addresses (domain mode). No sync runs while it is open, so end it before the nightly copy is due.")),
    ...sec("Records",
      li("Download drill history gives a spreadsheet of every drill (date, result, apps, isolation, problems) for the firm's WISP.",
        "The last 100 drills are kept.")));
}

function promoteChecks() {
  if (!view.checks) { api("GET", "api/promote/checks").then((c) => { view.checks = c; render(); }, (e) => { formErr = e.message; view.checks = { blocked: true, messages: [] }; render(); }); return card(P("Checking the primary…")); }
  const c = view.checks;
  return card(h("h2", {}, "Before you promote"), h("dl", {},
    h("dt", {}, "Primary"), h("dd", {}, c.primaryAlive ? "still answering" : c.primary ? `last seen ${when(c.primary.at)}` : "no sign of life"),
    h("dt", {}, "This box's copy"), h("dd", {}, c.dataAt ? `${when(c.dataAt)} (${age(c.dataAgeHours)})` : "none"),
    h("dt", {}, "Last check of the copy"), h("dd", {}, c.lastSyncFailed ? "the latest sync failed; the earlier verified copy will be used" : "verified")),
    h("div", { class: "banner " + (c.blocked ? "bad" : "warn"), style: "margin-top:12px" }, c.messages.length ? c.messages.map((m) => P(m)) : P("Nothing stands in the way.")), errLine(),
    h("div", { class: "row" }, c.blocked ? null : btn("Continue", () => go("promote-loss", { checks: c }), "primary"), btn("Check again", () => go("promote-checks")), btn("Back", () => go("home"))));
}

const STEP_NAMES = { recover: "Getting the copy ready", lease: "Recording that this box takes over", "leave-standby-mode": "Allowing apps to run here", place: "Putting the data in place and starting the apps", health: "Checking each app", "go-live": "Opening access for staff", finish: "Finishing" };
function promoteRun() {
  const pr = S.promote, res = pr.result, order = Object.keys(STEP_NAMES), by = Object.fromEntries(pr.steps.map((s) => [s.step, s]));
  const list = h("ol", { class: "steps" }, order.map((k) => h("li", {}, h("span", {}, STEP_NAMES[k]), h("span", { class: "muted" }, by[k] ? ({ done: "done", running: "working…", failed: "stopped" }[by[k].status] || "") : ""))));
  if (res && res.ok) return promoteDone(res);
  const stuck = !pr.running && pr.inProgress;
  if (!pr.running && !pr.inProgress && res && !res.ok) return card(h("h2", {}, "Promote did not start"),
    h("div", { class: "banner bad" }, P(res.error || "Something went wrong before the first step."), P("Nothing was changed on this box.")),
    h("div", { class: "row" }, btn("Back", () => { api("POST", "api/promote/dismiss").catch(() => {}); S.promote.result = null; go("home"); })));
  return card(h("h2", {}, pr.running ? "Promoting this box…" : "Promote was interrupted"), list,
    stuck ? [h("div", { class: "banner bad", style: "margin-top:12px" }, P("It stopped at “", STEP_NAMES[(res && res.failedStep) || ""] || "a step", "”."), res && res.error ? M(res.error) : null, P("Nothing is lost. Continue picks up at that step.")),
      errLine(), h("div", { class: "row" }, btn("Continue", () => act(() => api("POST", "api/promote/run", {})), "primary"), btn("Cancel the promote", () => act(() => api("POST", "api/promote/cancel"))))] : M("This takes several minutes. You can leave this page open."));
}
function promoteDone(res) {
  const d = res.deployment || {};
  return [h("div", { class: "banner ok" }, h("p", { class: "big" }, "This box is now live"), res.dataAt ? P("It is running the firm's apps with data from ", when(res.dataAt), ".") : P("It is running the firm's apps.")),
    card(h("h2", {}, "What to tell staff"),
      d.tunnel ? P("Nothing changes for them: the usual web address now leads to this box. They need to sign in again.")
        : d.mode === "domain" ? [P("The firm's web address still points at the old box. Change its DNS record so it points at this box:"), h("div", { class: "code" }, d.address || "this box's public address"), M("Ask whoever manages the firm's domain name if you are not sure how. Until that is done, staff can use this box's address directly.")]
        : [P("Staff now reach the apps at this box's address:"), h("div", { class: "code" }, d.address || "see Configuration → Network"), M("They need to sign in again.")],
      res.unhealthyApps.length ? h("div", { class: "banner warn" }, P("These apps did not report healthy yet. Check them on the Apps page:"), h("ul", {}, res.unhealthyApps.map((a) => h("li", {}, `${a.name}: ${a.detail}`)))) : null),
    card(h("h2", {}, "Two things to do soon"), h("ul", {},
      h("li", {}, "Set up Vibe Backup on this box. Backups do not carry over from the old box."),
      h("li", {}, "When the old box is repaired, do not just switch it on and use it. Open its console, choose Standby, then “Rejoin as standby”. Its old data is set aside for ", String(S.settings.archiveDays), " days before being replaced.")),
      h("div", { class: "row" }, btn("Done", () => { view = { name: "home" }; S.promote.result = null; render(); api("POST", "api/promote/dismiss").catch(() => {}); }, "primary")))];
}

function rejoinScreen() {
  return card(h("h2", {}, "Rejoin as standby"),
    P("This box will become the standby of the box that is now live. Its apps are stopped and its data is then replaced by a copy of the live box."),
    P("Before that, this box's current data is set aside here, read-only, for ", String(S.settings.archiveDays), " days, so that work entered only on this box can be looked up and typed in again."),
    ...typed(S.phrases.rejoin, "Set the data aside and rejoin", (t) => act(async () => { await api("POST", "api/rejoin", { confirm: t, skipArchive: val("skip") || undefined }); view = { name: "home" }; }), "danger",
      [h("label", { for: "skip" }, "Only if there is not enough disk: type ", S.phrases.skipArchive, " to skip setting the data aside"), h("input", { id: "skip", type: "text", autocomplete: "off" })]));
}

function replaced() {
  if (view.name === "rejoin") return rejoinScreen();
  if (view.name === "start-anyway") return card(h("h2", {}, "Start anyway"),
    h("div", { class: "banner bad" }, P("The other box is live. Starting this one too gives you two live copies with different data, and the public web address may reach either of them."), P("Only do this if the other box is being shut down and you have decided this box is the real one.")),
    ...typed(S.phrases.startAnyway, "Start this box's apps", (t) => act(async () => { await api("POST", "api/start-anyway", { confirm: t }); view = { name: "home" }; })));
  return h("div", { class: "banner bad", role: "alert" }, h("p", { class: "big" }, "This box was replaced"),
    P("While this box was off, the other box was promoted", S.replacedBy ? [" on ", when(S.replacedBy.writtenAt)] : "", " and is now the live one. This box has not started its apps."),
    P("Usually the right choice is to make this box the new standby."), errLine(),
    h("div", { class: "row" }, btn("Rejoin as standby…", () => go("rejoin"), "primary"), btn("Start anyway…", () => go("start-anyway"), "danger")));
}

function footer() {
  const out = [];
  if (S.archives.length) out.push(card(h("h2", {}, "Data set aside on this box"), M("Read-only copies kept when this box rejoined as a standby. To look something up, ask your IT person to open the folder named below under /opt/vibe/standby/local/archive."),
    h("ol", { class: "steps" }, S.archives.map((a) => h("li", {}, h("span", {}, a.name, h("span", { class: "muted" }, " · removed ", when(a.expiresAt))), btn("Delete now", () => { if (confirm("Delete this archive now? It cannot be recovered.")) act(() => api("POST", "api/archives/delete", { name: a.name })); }))))));
  out.push(h("p", { class: "muted small" }, "Box ID ", S.nodeId.slice(0, 8), " · version ", S.version, " · ", h("a", { href: "api/audit.csv" }, "Download the activity record")));
  return out;
}

function render() {
  if (!S) return;
  const focus = document.activeElement && document.activeElement.id, keep = {};
  document.querySelectorAll("input, textarea").forEach((i) => { if (i.id) keep[i.id] = i.type === "checkbox" ? i.checked : i.value; });
  let body;
  // A finished promote changes this box's role and ends its pairing, so its
  // closing screen is shown first, whatever the role is by now.
  if (S.promote && S.promote.result && S.promote.result.ok) body = [promoteDone(S.promote.result)];
  else if (S.role === "replaced") body = [replaced()];
  else if (!S.pairing) body = [unpaired()];
  else body = [view.name === "home" || view.name === "home-email" ? banner() : null, S.role === "primary" ? primary() : standby()];
  $app.replaceChildren(...[body, footer()].flat(3).filter(Boolean));
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) { if (el.type === "checkbox") el.checked = v; else el.value = v; } }
  if (focus && document.getElementById(focus)) document.getElementById(focus).focus();
}

async function poll() {
  await load();
  // Bucket-mode standby: collect the pairing bundle as soon as the primary leaves it.
  if (S && !S.pairing && view.name === "standby-bucket" && view.code) api("POST", "api/pair/bucket/complete").then(load, () => {});
  if (S && S.pairing && /-(direct|bucket)$/.test(view.name)) { view = { name: "home" }; render(); }
}
poll();
timer = setInterval(poll, 4000);
</script>
</body>
</html>
